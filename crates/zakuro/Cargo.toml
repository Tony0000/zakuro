[package]
name = "zakuro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A high-level-emulation Nintendo 3DS emulator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zakuro"
path = "src/main.rs"

[features]
default = ["opengl"]
# the OpenGL presenter, for machines with no Vulkan driver. macOS has none
# worth having, builds there leave it out and present through MoltenVK
opengl = ["zakuro-gpu/opengl", "dep:glutin", "dep:glutin-winit"]

[dependencies]
zakuro-common.workspace = true
zakuro-core.workspace = true
zakuro-fs.workspace = true
zakuro-gpu = { workspace = true, features = ["vulkan"] }
log.workspace = true
env_logger = "0.11"
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
cpal = "0.16"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "wayland", "x11"] }
ab_glyph = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
recomp3ds = { git = "https://github.com/fearkov/3dsrecomp" }
sha2 = "0.10"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
# texture packs come zipped
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[dev-dependencies]
zakuro-fs = { workspace = true, features = ["testing"] }

# the computer's camera, for the console's, with the frames turned into
# pictures here rather than by its C decoder
# the menus of the bar macOS keeps at the top of the screen and Windows in
# the window, the same as the menu Escape opens over a game
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "0.21", default-features = false }

# the running game's icon in the Dock, which macOS takes from the
# application rather than the window
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSGeometry"]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }
